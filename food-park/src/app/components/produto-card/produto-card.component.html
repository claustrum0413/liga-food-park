<ion-card *ngIf="produto">
  <ion-card-header>
    <span><b>{{ produto.nome }}</b></span>
  </ion-card-header>

  <ion-card-content>
    <p class="truck">{{ produto.truck }}</p>
    <p><b>Preço: {{ produto.preco }}</b></p>
    <ion-button (click)="adicionarPedido(produto)">Adicionar ao pedido</ion-button>
  </ion-card-content>

</ion-card>
