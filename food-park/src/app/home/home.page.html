<ion-header>
  <ion-toolbar>
    <ion-title>Food Park</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="verCombo()">Ver combo ({{ qtdCombo }})</ion-button>
      <ion-button (click)="sair()">Sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="filtros">
    <ion-button
      size="small"
      shape="round"
      [fill]="categoriaAtual === 'todas' ? 'solid' : 'outline'"
      (click)="filtrar('todas')">
      Todos
    </ion-button>

    @for (categoria of categorias; track categoria) {
      <ion-button
        size="small"
        shape="round"
        [fill]="categoriaAtual === categoria ? 'solid' : 'outline'"
        (click)="filtrar(categoria)">
        {{ categoria }}
      </ion-button>
    }
  </div>

  @for (produto of produtos; track produto.id) {
    <app-produto-card
      [produto]="produto"
      [noCarrinho]="produtoService.estaNoCarrinho(produto.id)"
      (adicionar)="adicionar($event)"
      (remover)="remover($event)">
    </app-produto-card>
  }

</ion-content>
